server {
    listen 80;

    # คำขอที่ขึ้นต้นด้วย /api ส่งไป Go backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # นอกนั้นส่งไปให้ container web (Vue)
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}
